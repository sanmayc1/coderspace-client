name: CI Test

 on:
   push:
     branches:
       - main

  jobs:
    test:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout Code
         uses: actions/checkout@v7

       - name: Setup Node
         uses: actions/setup-node@v4
         with:
           node-version:22
         
       - name: Install dependency
          run: npm ci
      
      
     